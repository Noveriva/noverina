name: "noverina"
services:
  compose-dashboard:
    image: "mcr.microsoft.com/dotnet/aspire-dashboard:13.5"
    ports:
      - "127.0.0.1:18888:18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "always"
  api:
    image: "${API_IMAGE:-noverina-api:local}"
    build:
      context: ".."
      dockerfile: "src/Noverina.Api/Dockerfile"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "api"
      ASPNETCORE_ENVIRONMENT: "Development"
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - "aspire"
networks:
  aspire:
    driver: "bridge"
